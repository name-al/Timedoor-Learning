<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div.about {
        display: flex;
        justify-content: center;
        margin-left: auto;
        margin-right: auto;
        margin-top: 5px;
        margin-bottom: 30px;
        background-color: rgb(0, 0, 0);
        width: 80%;
        border: 3px solid;
        border-image: linear-gradient(to right, red,orange,yellow,green,blue,indigo,violet) 1;
        border-radius: 100em;
      }
      .about {
        text-align: left;
        color: rgb(255, 255, 255);
        padding: 10px;
        margin-right: 300px;
        width: 100%;
      }
      div.image-about {
        margin-bottom: auto;
        margin-top: auto;
      }
      img.about-us {
        width: 300px;
      }
      body {
        background-color: rgb(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <section>
      <div class="about">
        <div>
          <h2 class="about">About Us</h2>
          <p class="about">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad illum
            ducimus ullam aperiam eius impedit dolores iusto unde nulla,
            provident ratione repellendus quam delectus vel quasi nobis quidem
            sapiente nostrum?
          </p>
        </div>
        <div class="image-about">
          <img
            src="../Project1/assets/imgAbout.jpg"
            alt="About Us"
            width="450px"
            height="auto"
            class="about-us"
          />
        </div>
      </div>
    </section>
  </body>
</html>
